global
  log stdout format raw local0

defaults
  log global
  timeout connect 5s
  timeout client 30s
  timeout server 30s

# Docker's embedded DNS returns one A record per api replica.
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 1s
  hold other 1s
  accepted_payload_size 8192

# Per request: every HTTP request is balanced on its own, even on a kept-alive connection.
frontend http_in
  mode http
  bind :8080
  default_backend api_http

# Per connection: a kept-alive connection stays on one instance, like a Kubernetes Service.
frontend tcp_in
  mode tcp
  bind :8081
  default_backend api_tcp

# server-template creates up to 10 slots filled from DNS, so scaling needs no config edits.
backend api_http
  mode http
  balance roundrobin
  server-template api 10 api:3001 check resolvers docker resolve-prefer ipv4 init-addr none

backend api_tcp
  mode tcp
  balance roundrobin
  server-template api 10 api:3001 check resolvers docker resolve-prefer ipv4 init-addr none
