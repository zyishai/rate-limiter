name: rate-limiter

services:
  api:
    build: .
    init: true
    environment:
      PORT: 3001
      REDIS_URL: redis://toxiproxy:6380
      INSTANCES: ${INSTANCES:-3}
    deploy:
      replicas: ${INSTANCES:-3}
    depends_on:
      - toxiproxy

  redis:
    image: redis:8.8-alpine

  # Sits between the api and Redis so load tests can add latency or cut the connection.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:8474:8474" # control API, unauthenticated, so local only
    depends_on:
      - redis

  haproxy:
    image: haproxy:3.4-alpine
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8080:8080" # http mode, balanced per request
      - "8081:8081" # tcp mode, balanced per connection
    depends_on:
      - api

  # Load generator, started only on demand: docker compose run --rm k6 run ...
  k6:
    image: grafana/k6:2.3.0
    profiles: ["load"]
    working_dir: /
    volumes:
      - ./load:/load:ro
      - ./results:/results
    environment:
      BASE_URL: http://haproxy:8080
      TCP_URL: http://haproxy:8081
      TOXIPROXY_URL: http://toxiproxy:8474
      K6_WEB_DASHBOARD_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:5665:5665" # live dashboard, needs `docker compose run --service-ports`
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
